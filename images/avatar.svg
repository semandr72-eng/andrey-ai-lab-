<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Andrey AI Lab avatar">
  <defs>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9fc"/>
      <stop offset="100%" stop-color="#d6e4ec"/>
    </linearGradient>
    <linearGradient id="avatarFigure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8a9a"/>
      <stop offset="100%" stop-color="#1c2126"/>
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="url(#avatarBg)"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Shoulders -->
  <path d="M22 82 Q50 60 78 82 V96 H22 Z" fill="url(#avatarFigure)"/>

  <!-- Head -->
  <circle cx="50" cy="44" r="19" fill="url(#avatarFigure)"/>

  <!-- Accent dot / AI node -->
  <circle cx="50" cy="70" r="3" fill="#5b8a9a" filter="url(#avatarGlow)"/>
  <circle cx="38" cy="76" r="1.5" fill="#5b8a9a" opacity="0.6"/>
  <circle cx="62" cy="76" r="1.5" fill="#5b8a9a" opacity="0.6"/>

  <!-- Subtle horizon line -->
  <line x1="28" y1="58" x2="72" y2="58" stroke="#9aaab4" stroke-width="0.5" opacity="0.4"/>
</svg>