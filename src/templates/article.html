<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{description}}">
  <title>{{title}} | Andrey AI Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="alternate" type="application/rss+xml" title="Andrey AI Lab" href="../../rss.xml">
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <article class="article-page">
      <div class="container">
        <header class="article-page__header">
          <div class="article-card__meta">
            <time datetime="{{date}}">{{formattedDate}}</time>
            {{tags}}
          </div>
          <h1 class="article-page__title">{{title}}</h1>
          <p class="article-page__lead">{{description}}</p>
        </header>

        <div class="article-page__content">
          {{content}}
        </div>

        <footer class="article-page__footer">
          <a href="../../articles.html" class="button button--ghost">← Все статьи</a>
          <a href="../../index.html#contact" class="button button--primary">Обсудить</a>
        </footer>
      </div>
    </article>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../../js/components.js"></script>
  <script src="../../js/main.js"></script>
</body>
</html>
